syntax = "proto3";

package znasllc.memql.worker.v1;

option go_package = "github.com/znasllc-io/memql/component/grpc/gen;memqlv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// WorkerService is the bidi-stream surface a Cockpit worker
// process opens against the agent node. Per-user routing: the worker's
// token authenticates as a worker:<id> principal owned by exactly one
// human user; only agents acting in sessions owned by that user can
// dispatch to this worker.
service WorkerService {
  rpc Stream(stream WorkerClientMessage) returns (stream WorkerServerMessage);
}

// -----------------------------------------------------------------------------
// Envelopes
// -----------------------------------------------------------------------------

message WorkerClientMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;

  oneof payload {
    Register register = 10;
    Heartbeat heartbeat = 11;
    ToolResult tool_result = 12;
    ToolStream tool_stream = 13;
    AuditEvent audit_event = 14;
    RotationRequest rotation_request = 15;
    AppSessionChunk app_session_chunk = 16;
    AppSessionEnd app_session_end = 17;
    ModelCallDelta model_call_delta = 18;
    ModelCallEnd model_call_end = 19;
    ModelPullProgress model_pull_progress = 20;
    ModelPullEnd model_pull_end = 21;
  }
}

message WorkerServerMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;

  oneof payload {
    RegisterAck register_ack = 10;
    ToolDispatch tool_dispatch = 11;
    ToolCancel tool_cancel = 12;
    Drain drain = 13;
    RotationResponse rotation_response = 14;
    RegisterError register_error = 15;
    AppSessionStart app_session_start = 16;
    AppSessionControl app_session_control = 17;
    ModelCallStart model_call_start = 18;
    ModelCallCancel model_call_cancel = 19;
    ModelPullStart model_pull_start = 20;
    ModelPullCancel model_pull_cancel = 21;
  }
}

// -----------------------------------------------------------------------------
// Registration
// -----------------------------------------------------------------------------

message Register {
  string name = 1;
  // Capabilities advertised. "HEADLESS" must always be present;
  // "COMPUTERUSE" is an optional addition declared only by
  // computer-use builds of memql with TCC / X11 confirmed available.
  repeated string capabilities = 2;
  map<string, string> labels = 3;
  // Per-capability concurrency caps. e.g. {"HEADLESS": 8, "COMPUTERUSE": 1}.
  map<string, uint32> concurrency = 4;
  PlatformInfo platform = 5;
  PermissionStatus permissions = 6;
  string version = 7;
  // build_tag = "computeruse" or "headless".
  string build_tag = 8;
  // Optional structured capability self-description, serialized as
  // JSON (memql#1330 / memql-cockpit#162). Shape (schemaVersion 1):
  //   {"platform": "<GOOS>",
  //    "displayServer": "quartz"|"x11"|"wayland"|"none",
  //    "computerUseAvailable": bool,
  //    "actions": ["<workerComputer action name>", ...],
  //    "schemaVersion": 1}
  // Validated server-side (size cap, schemaVersion, displayServer
  // enum, action-name pattern -- see component/worker). Workers that
  // omit it register exactly as before; HEADLESS/COMPUTERUSE capability
  // strings keep their scope-check semantics unchanged.
  string capability_descriptor_json = 9;
  // Local apps the cockpit found on this machine (memql#4359). The
  // engine's runnable set is closed (claude-code, codex); an app the
  // engine does not know is stored on the registration and never
  // produces a routing label, so a cockpit may report more than the
  // engine can drive without a coordinated release.
  repeated AppInfo apps = 10;
  // app_descriptors say HOW the cockpit drives each app it reported
  // (epic memql#5096, design D8). The id set stays closed in the engine;
  // what grows is the SHAPE, so a newer cockpit never makes the engine
  // attempt a protocol the machine does not have.
  //
  // Register is accepted exactly ONCE per stream, so these cannot be
  // refreshed on a heartbeat the way `apps` can. A cockpit that gains a
  // harness mid-connection advertises it on its next reconnect -- the
  // same rollout cost the model labels already carry.
  repeated AppDescriptor app_descriptors = 11;
}

// AppDescriptor is how one app on this machine is DRIVEN.
//
// `harness` is the protocol the cockpit will speak to it, and the engine
// must not infer it from the app id: the cockpit picks codex-app-server
// only when the binary answers `codex app-server --help` and falls back to
// codex-mcp otherwise, so one id legitimately reports either word.
message AppDescriptor {
  // id matches an AppInfo.id on the same Register.
  string id = 1;
  // harness is one of "claude-headless", "codex-app-server", "codex-mcp".
  // An unrecognised word leaves the descriptor UNUSED rather than
  // refusing the registration -- the same rule the closed app-id set
  // follows, for the same reason.
  string harness = 2;
  // structured_result reports that this harness can return a structured
  // final answer when AppSessionStart carries a response schema.
  bool structured_result = 3;
  // follow_ups reports that a session can take another turn through
  // AppSessionControl{action: "message"}. A machine that says false is
  // refused a follow-up BEFORE the wire, so the engine never waits on a
  // turn that will not come.
  bool follow_ups = 4;
}

// AppInfo is one local app the cockpit detected. `allowed` is the
// machine's own `policy.yaml apps.allow` verdict and `signed_in` is
// the app's auth state as the cockpit can observe it; BOTH must be
// true before the engine derives an `app:<id>` routing label, so a
// machine that has the binary but cannot actually run it is never
// selected.
message AppInfo {
  // id is the app's stable identifier: "claude-code" or "codex".
  string id = 1;
  // version is the CLI's own version string, reported verbatim.
  string version = 2;
  // signed_in is the app's auth state as the cockpit can detect it.
  bool signed_in = 3;
  // subscription is what the app REPORTS -- "unknown", "none" or
  // "present". Never inferred from anything else.
  string subscription = 4;
  // allowed mirrors `policy.yaml apps.allow` on the machine.
  bool allowed = 5;
}

message PlatformInfo {
  string os = 1;
  string arch = 2;
  string hostname = 3;
}

message PermissionStatus {
  bool accessibility = 1;
  bool screen_recording = 2;
  bool x11_display = 3;
  string detail = 4;
}

message RegisterAck {
  string registration_id = 1;
  google.protobuf.Timestamp registered_at = 2;
  // Server-resolved owner user id for cross-checking on the worker side.
  string owner_user_id = 3;
}

message RegisterError {
  string code = 1;
  string message = 2;
}

// -----------------------------------------------------------------------------
// Liveness
// -----------------------------------------------------------------------------

message Heartbeat {
  google.protobuf.Timestamp ts = 1;
  uint32 active_calls_total = 2;
  map<string, uint32> active_calls_per_capability = 3;
  // apps re-reports the local app inventory (memql#4359). A cockpit
  // that signs into Claude Code mid-connection becomes routable on
  // the next beat instead of on the next reconnect. Omitting the
  // field leaves the registration's apps untouched -- an empty list
  // is how a cockpit says "I now have none".
  repeated AppInfo apps = 4;
  // apps_present distinguishes "I am reporting an empty inventory"
  // from "I am not reporting apps at all", which proto3 repeated
  // fields cannot express on their own.
  bool apps_present = 5;
}

// -----------------------------------------------------------------------------
// Tool dispatch (agent -> worker)
// -----------------------------------------------------------------------------

message ToolDispatch {
  string call_id = 1;
  // run_id / step_id were plan_id / task_id until memql#5053. Renamed in
  // place: this is a mesh-internal envelope with no external consumer, and
  // pre-release rules carry no compatibility window.
  string run_id = 2;
  string step_id = 3;
  string agent_id = 4;
  string correlation_id = 5;
  // tool = "workerHost" or "workerComputer"
  string tool = 6;
  string action = 7;
  // Discriminated-union args: {action: <X>, X: {...}} serialized as JSON.
  bytes args_json = 8;
  google.protobuf.Duration timeout = 9;
}

message ToolCancel {
  string call_id = 1;
  string reason = 2;
}

// Drain tells the worker to stop accepting new dispatches, finish
// in-flight ones, and exit cleanly. Server-initiated.
message Drain {
}

// -----------------------------------------------------------------------------
// Tool result / streaming (worker -> agent)
// -----------------------------------------------------------------------------

message ToolStream {
  string call_id = 1;
  oneof payload {
    bytes stdout_chunk = 2;
    bytes stderr_chunk = 3;
    bytes data_chunk = 4;
  }
}

message ToolResult {
  string call_id = 1;
  oneof payload {
    Success success = 2;
    Failure failure = 3;
  }
}

message Success {
  bytes result_json = 1;
  int32 exit_code = 2;
  uint64 bytes_in = 3;
  uint64 bytes_out = 4;
  string output_preview = 5;
}

message Failure {
  // Common error codes:
  //   worker_disconnected
  //   scope_exceeded
  //   denied_by_policy
  //   timeout
  //   exec_failed
  //   fs_denied
  //   http_blocked
  //   kill_switch_engaged
  //   no_worker_available
  string error_code = 1;
  string error_message = 2;
}

// -----------------------------------------------------------------------------
// Token rotation
// -----------------------------------------------------------------------------

message RotationRequest {
  google.protobuf.Timestamp current_token_expires_at = 1;
}

message RotationResponse {
  string new_token = 1;
  google.protobuf.Timestamp new_token_expires_at = 2;
}

// -----------------------------------------------------------------------------
// Worker-emitted audit events
// -----------------------------------------------------------------------------

message AuditEvent {
  string action = 1;
  bytes detail_json = 2;
  google.protobuf.Timestamp ts = 3;
}

// -----------------------------------------------------------------------------
// App sessions (memql#4359)
//
// A one-shot ToolDispatch carries a single timeout and returns one
// result; a headless `claude -p` can run for an hour and produces
// output the whole way. So an app run is a SESSION, not a dispatch:
// start / chunk / control / end, correlated by session_id, with no
// ceiling but the delegation policy's.
// -----------------------------------------------------------------------------

// AppSessionStart opens a session. Server -> worker.
message AppSessionStart {
  // session_id correlates every later message. Server-minted; it is
  // the v1:worker:appSession row's short id.
  string session_id = 1;
  // app is one of the engine's closed ids ("claude-code", "codex").
  string app = 2;
  // kind selects what opening the app means:
  //   run    -- headless and autonomous; the engine reads the output.
  //   open   -- launch it for the HUMAN with the workspace and prompt
  //             loaded; ends when the window closes, or immediately
  //             with a failure if the app cannot be opened.
  //   attach -- stream a run the human started, named by app_session_ref.
  string kind = 3;
  string prompt = 4;
  // inputs are Library artifact ids the cockpit pulls with the
  // session credential before the run starts.
  repeated string inputs = 5;
  // workspace is the absolute directory on the machine the app runs in.
  string workspace = 6;
  // credential is the per-run bearer for mcp_endpoint. Short-lived,
  // user-scoped, revoked at end; the cockpit writes it into the app's
  // MCP configuration and deletes that file when the session ends.
  string credential = 7;
  // mcp_endpoint is the streamable-HTTP MCP URL (https://mcp.<domain>/mcp).
  string mcp_endpoint = 8;
  // limits carries the delegation policy's ceilings for this run.
  AppSessionLimits limits = 9;
  // run_id / step_id attribute the session for the ledger (memql#5053).
  string run_id = 10;
  string step_id = 11;
  // app_session_ref names the app's OWN session id on the kind=attach
  // path. Empty for run and open.
  string app_session_ref = 12;
  // response_schema_json is the JSON Schema the harness is asked to
  // answer against (`claude --json-schema`, the Codex app-server turn's
  // structured output). EMPTY MEANS NO STRUCTURED ANSWER WAS ASKED FOR,
  // which is not the same as asking for one and getting none: a session
  // started without it can still end with a transcript, and only a
  // session that asked can be disappointed.
  string response_schema_json = 13;
}

// AppSessionLimits are the policy ceilings a session runs under.
message AppSessionLimits {
  // credential_lifetime_seconds is when the bearer in AppSessionStart
  // expires. The worker asks for a renewal before then; the engine
  // sends AppSessionControl{action: "renew_credential"}.
  int64 credential_lifetime_seconds = 1;
  // max_duration_seconds is the wall-clock ceiling, 0 for none.
  int64 max_duration_seconds = 2;
  // max_transcript_bytes bounds what the engine will keep on the row.
  int64 max_transcript_bytes = 3;
}

// AppSessionControl steers a running session. Server -> worker.
message AppSessionControl {
  string session_id = 1;
  // action is "cancel", "renew_credential" or "message".
  string action = 2;
  // credential is the replacement bearer on the renew path.
  string credential = 3;
  // reason is free text carried into the transcript on cancel.
  string reason = 4;
  // prompt is the follow-up handed to the app on action="message"
  // (design D7). It has its OWN field rather than riding `reason`,
  // which is documented as transcript free-text on cancel: one field
  // meaning two things is a field whose value cannot be read without
  // knowing which branch produced it.
  string prompt = 5;
}

// AppSessionChunk is one piece of session output. Worker -> server.
message AppSessionChunk {
  string session_id = 1;
  // stream is "stdout", "stderr" or "event". An "event" chunk carries
  // a JSON body the engine maps to a planner ProgressEvent.
  string stream = 2;
  bytes data = 3;
  // seq is monotonic per session; the engine drops out-of-order and
  // duplicate chunks rather than corrupting the transcript.
  uint64 seq = 4;
}

// AppSessionEnd closes a session. Worker -> server.
message AppSessionEnd {
  string session_id = 1;
  int32 exit_code = 2;
  AppSessionUsage usage = 3;
  // app_session_ref is the app's own session id, so a later
  // kind=attach can resume this run.
  string app_session_ref = 4;
  // produced_artifact_ids are Library artifact ids the cockpit pushed.
  repeated string produced_artifact_ids = 5;
  // error is empty on a clean end.
  string error = 6;
  // result_json is the harness's STRUCTURED final answer, when it
  // produced one -- the reply to AppSessionStart.response_schema_json.
  //
  // IT DOES NOT IMPLY SUCCESS, and the separation from `error` and
  // `exit_code` is the point: Claude Code can emit a structured result
  // AND exit non-zero, and folding the two would make an answer we have
  // unreadable because the run that produced it also failed. A session
  // that ends without one still yields its transcript and artifacts,
  // exactly as before.
  string result_json = 7;
}

// AppSessionUsage is what the app REPORTED about its own spend.
// Never inferred: an app that reports nothing sets known=false and
// leaves the counts at zero, which the ledger records as billing
// "unknown" rather than as a free call.
message AppSessionUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  double cost_usd = 3;
  bool known = 4;
}

// -----------------------------------------------------------------------------
// Model calls (epic memql#4676, task memql#4677)
//
// A model call is a streamed exchange over the stream the cockpit
// ALREADY holds open. That is the whole reason the transport is this
// and not an HTTP endpoint: the engine cannot dial a laptop behind
// NAT, so the outward stream IS the tunnel -- the same argument that
// made app sessions ride it (memql#4358).
//
// It is shaped like AppSession rather than like ToolDispatch for the
// same reason app sessions were: a dispatch carries one timeout and
// returns one result, while a generation emits tokens for as long as
// it runs. Start / delta / end / cancel, correlated by request_id.
//
// THE CHUNK RULE IS INHERITED VERBATIM. `seq` is monotonic per call and
// out-of-order or duplicate deltas are DROPPED. A generation is a
// record in exactly the way a transcript is: splicing a replayed delta
// back into the middle produces text no later reader can tell is wrong.
//
// TIMEOUT AND KEEPALIVE LIVE ON THE ENVELOPE (ModelCallLimits), not in
// the caller's head. A local 8B model on a cold GPU can take twenty
// seconds to emit its first token, which is indistinguishable from a
// wedged machine to anyone holding only a wall-clock deadline; so the
// two are separated -- a whole-call ceiling and an IDLE ceiling -- and
// the worker is told how often to prove it is alive between deltas.
// -----------------------------------------------------------------------------

// ModelCallStart opens a call. Server -> worker.
message ModelCallStart {
  // request_id correlates every later message. Server-minted.
  string request_id = 1;
  // model is the runtime-facing model id the machine advertised as
  // `model:<id>` -- the router selected on this exact string, so the
  // worker resolves it without translation.
  string model = 2;
  // kind selects what the call IS. Six values (epic memql#5137, D4):
  //
  //   "chat"       messages -> text
  //   "embedding"  embedding_input -> vectors
  //   "vision"     messages carrying images -> text
  //   "transcribe" audio -> text with timestamps
  //   "speak"      messages -> audio
  //   "image"      messages -> image bytes
  //
  // ONE FIELD RATHER THAN SIX MESSAGE FAMILIES because everything else about
  // the exchange -- selection, the chunk rule, limits, usage, cancel -- is
  // identical, and a second family would be a second place for all of that to
  // drift. It is also why the four new kinds needed no new transport: the
  // stream, the credential and the ledger already exist.
  //
  // A machine serves a kind only if its `model:<id>` label advertised the
  // matching flag (vision=, audioin=, audioout=, imagegen=). False is ABSENCE,
  // so a machine that says nothing is skipped during selection rather than
  // picked and then failed.
  string kind = 3;
  repeated ModelCallMessage messages = 4;
  ModelCallParams params = 5;
  // response_format_schema is a JSON Schema for structured output.
  // Empty means free text. A worker whose runtime cannot honour a
  // schema must fail the call rather than return prose: the router only
  // ever sends this to a machine that advertised the capability, so a
  // silent downgrade here would defeat the gating that put it there.
  bytes response_format_schema = 6;
  // embedding_input is the kind="embedding" payload.
  repeated string embedding_input = 7;
  ModelCallLimits limits = 8;
  // run_id / step_id attribute the call for the ledger (memql#5053).
  string run_id = 9;
  string step_id = 10;
  // purpose names the platform operation this call serves (planner,
  // conductor, suggest, embeddings). Carried for the ledger and for the
  // machine's own logs; it steers nothing.
  string purpose = 11;
  // tools are the functions the model may call this turn (design D11).
  // EMPTY IS AN ORDINARY CHAT TURN. A machine whose runtime cannot do
  // tool calling advertises `tools=0` on its model label and is skipped
  // for a turn that carries any -- gating, not a downgrade, for the same
  // reason response_format_schema is gated: a runtime that answered
  // prose to a tool turn would defeat the selection that put it there.
  repeated ModelCallTool tools = 12;
  // audio is the kind="transcribe" INPUT: the bytes to be transcribed.
  // Empty for every other kind.
  ModelCallAudio audio = 13;
  // speech carries the kind="speak" KNOBS -- voice, container, rate. The TEXT
  // to speak rides `messages` as an ordinary role="user" turn rather than a
  // field of its own, because a second place for a prompt to live is a second
  // place for it to be read from and they drift.
  ModelCallSpeech speech = 14;
  // image carries the kind="image" KNOBS -- size, count, format. The prompt
  // rides `messages`, for the reason on `speech` above. The generation seed is
  // ModelCallParams.seed, reused rather than duplicated here.
  ModelCallImageRequest image = 15;
}

// ModelCallTool is one function the model may call, as the caller
// declared it.
message ModelCallTool {
  string name = 1;
  string description = 2;
  // parameters_json is the tool's JSON Schema, carried VERBATIM as a
  // string. Deliberately not a google.protobuf.Struct: the worker
  // forwards it unchanged into Ollama's /api/chat `tools[].function.
  // parameters` and the OpenAI-compatible equivalent, and a decode and
  // re-encode through Struct loses key order and turns every integer
  // bound into a float -- a schema that still parses and no longer says
  // what it said.
  string parameters_json = 3;
}

// ModelCallToolCall is one call the model made.
message ModelCallToolCall {
  string id = 1;
  string name = 2;
  // arguments_json is the arguments object as a STRING. The two runtimes
  // disagree -- Ollama's /api/chat returns an object, the
  // OpenAI-compatible shape returns a string -- and the worker
  // normalises to the string so the engine decodes one shape rather than
  // branching on which machine answered.
  string arguments_json = 3;
  // index is the call's position within the assistant turn.
  //
  // It exists for the DELTA path and is the reason a delta can carry
  // tool calls at all: an OpenAI-compatible stream emits tool calls by
  // index with `arguments` arriving in fragments, so without it a
  // reassembler cannot tell a second call from the continuation of the
  // first. Ollama does not stream partial tool calls -- it emits one
  // complete list on the final message -- so a delta carrying these is
  // an OpenAI-compatible runtime and an end carrying them is either.
  int32 index = 4;
}

// ModelCallMessage is one turn of the conversation handed to the model.
message ModelCallMessage {
  // role is "system", "user", "assistant" or "tool".
  string role = 1;
  string content = 2;
  // tool_call_id names the call a role="tool" message ANSWERS. Both
  // runtimes require it to round-trip: a result with no id cannot be
  // matched to its request, and a model handed one refuses the turn or
  // invents an answer.
  string tool_call_id = 3;
  // name is the tool's name on a role="tool" message. Carried beside the
  // id because the OpenAI-compatible shape wants both.
  string name = 4;
  // tool_calls are the calls an assistant turn MADE, replayed back into
  // the conversation so the model can see what it already asked for.
  repeated ModelCallToolCall tool_calls = 5;
  // images are the image parts of a kind="vision" turn.
  //
  // THEY BELONG TO A TURN, which is why they are here rather than on
  // ModelCallStart (epic memql#5137, D4). Both runtimes attach images per
  // message -- Ollama's /api/chat takes `images: [base64]` on the message, the
  // OpenAI-compatible shape takes a content array with image_url on it -- so a
  // repeated field on Start would need its own index back to a message to say
  // which turn each image belonged to.
  //
  // Raw bytes, not base64: encoding and the data: URL are the worker's business
  // and differ between the two runtimes, so doing it here would mean undoing it
  // on one of them.
  repeated ModelCallImage images = 6;
}

// ModelCallParams are the generation knobs.
//
// Each optional knob carries an explicit *_set companion because zero
// is a MEANINGFUL value for both of them: temperature 0 is the setting
// structured-output prompts actually want, and it is not the same
// request as "the caller expressed no preference". Reading absent as
// zero would silently pin every unspecified call to greedy decoding.
message ModelCallParams {
  double temperature = 1;
  bool temperature_set = 2;
  double top_p = 3;
  bool top_p_set = 4;
  int64 max_output_tokens = 5;
  repeated string stop = 6;
  // seed is a determinism request; runtimes that cannot honour it
  // ignore it rather than failing.
  int64 seed = 7;
  bool seed_set = 8;
}

// ModelCallLimits are the envelope-owned deadlines.
message ModelCallLimits {
  // timeout_seconds is the WHOLE-CALL ceiling; 0 means the server
  // default rather than "no limit", because an unbounded generation on
  // somebody's laptop is a resource leak nobody is watching.
  int64 timeout_seconds = 1;
  // idle_timeout_seconds bounds the gap BETWEEN deltas, which is the
  // measurement that actually distinguishes a slow model from a dead
  // one. A first token twenty seconds after start is a cold GPU; twenty
  // seconds of silence after the fifth token is a wedge.
  int64 idle_timeout_seconds = 2;
  // keepalive_seconds is how often the worker must emit a delta with
  // keepalive=true when it has no content to send. It is the contract
  // that makes idle_timeout_seconds enforceable rather than a guess:
  // without it, silence means both "still thinking" and "gone".
  int64 keepalive_seconds = 3;
}

// ModelCallDelta is one piece of generated output. Worker -> server.
message ModelCallDelta {
  string request_id = 1;
  // seq is monotonic per request; the engine drops out-of-order and
  // duplicate deltas rather than corrupting the generation.
  uint64 seq = 2;
  string content = 3;
  // keepalive marks a delta that carries no content and exists only to
  // reset the idle timer. It still takes a seq, so a keepalive can
  // never be confused with a replayed content delta.
  bool keepalive = 4;
  // tool_calls carries INCREMENTAL tool-call fragments: `index` names
  // which call the fragment belongs to and `arguments_json` is a piece
  // of that call's arguments, not the whole. Only an OpenAI-compatible
  // runtime populates these; Ollama emits its tool calls complete on the
  // end. The engine assembles by index and reads the END's list as
  // authoritative, so a runtime that streams nothing here loses nothing.
  repeated ModelCallToolCall tool_calls = 5;
  // segments are the timed spans of a kind="transcribe" WINDOW (epic
  // memql#5137, D5). The streaming flow transcribes accumulated audio in
  // five-second windows and emits one delta per window: `content` is that
  // window's text and these are its timings. The END's segments are
  // authoritative over anything assembled from here.
  repeated ModelCallTranscriptSegment segments = 6;
  // audio is a chunk of a streamed kind="speak" result.
  //
  // It follows `content`'s rule exactly: a worker that streams leaves the END's
  // audio empty and the engine concatenates what it accepted; one that does not
  // stream answers on the END. Both are supported because a Kokoro runtime
  // streams and a one-shot TTS does not, and neither should need its own code
  // path.
  ModelCallAudio audio = 7;
}

// ModelCallEnd closes a call. Worker -> server.
message ModelCallEnd {
  string request_id = 1;
  // finish_reason is "stop", "length", "cancelled", "timeout" or
  // "error".
  string finish_reason = 2;
  ModelCallUsage usage = 3;
  // content is the FULL text for a call the worker did not stream. A
  // worker that streamed deltas leaves this empty; the engine
  // concatenates the deltas it accepted. Both are supported because a
  // small embeddings or classification call has no reason to stream.
  string content = 4;
  // embeddings are the kind="embedding" result, one vector per input in
  // input order.
  repeated ModelCallEmbedding embeddings = 5;
  // error is empty on a clean end.
  string error = 6;
  // error_code is a stable machine-readable tag when error is set.
  string error_code = 7;
  // tool_calls is the COMPLETE list the turn produced, always populated
  // by a runtime that made any. It is authoritative over anything
  // assembled from the deltas: a stream that dropped a fragment would
  // otherwise hand the engine arguments that parse and are wrong.
  repeated ModelCallToolCall tool_calls = 8;
  // segments is the COMPLETE timed transcript of a kind="transcribe" call, and
  // is authoritative over anything assembled from the deltas -- the same rule
  // tool_calls follows above, for the same reason: a stream that dropped a
  // window would leave a transcript that reads fine and is missing five seconds.
  repeated ModelCallTranscriptSegment segments = 9;
  // audio is the FULL kind="speak" result for a worker that did not stream. One
  // that streamed leaves this empty, exactly as it does with `content`.
  ModelCallAudio audio = 10;
  // images is the kind="image" result, one entry per generated image, in the
  // order requested.
  repeated ModelCallImage images = 11;
}

// ModelCallEmbedding is one vector.
message ModelCallEmbedding {
  repeated float values = 1;
}

// ModelCallImage is one image, in either direction: an image part on a vision
// turn, or a generated image on the end of a kind="image" call. ONE message
// rather than two because the shape is identical, and two would drift.
message ModelCallImage {
  bytes data = 1;
  // media_type is the IANA type of `data` -- "image/png", "image/jpeg",
  // "image/webp". Carried because the OpenAI-compatible shape needs it to build
  // a data: URL and Ollama does not, so the wire states it once and each worker
  // uses what its own runtime wants.
  string media_type = 2;
}

// ModelCallAudio is one span of audio, in either direction: the input of a
// kind="transcribe" call, or the output of a kind="speak" one.
message ModelCallAudio {
  bytes data = 1;
  // media_type is the IANA type of `data` -- "audio/wav", "audio/mpeg",
  // "audio/ogg".
  //
  // THE ENGINE DOES NOT VALIDATE IT AGAINST A CLOSED SET, deliberately. Which
  // containers a runtime can decode is knowledge the WORKER has, and the worker
  // refuses an unrecognised type by name rather than passing it through: a
  // runtime handed bytes it decodes as something they are not returns a
  // confident transcript of noise, which nobody notices. A second copy of that
  // list here would be a second thing to keep current, and the engine is the
  // half with no way to check it.
  string media_type = 2;
  // sample_rate_hz is what the bytes ARE, not a request for what they should
  // become.
  int32 sample_rate_hz = 3;
}

// ModelCallTranscriptSegment is one timed span of a transcript.
message ModelCallTranscriptSegment {
  double start_seconds = 1;
  double end_seconds = 2;
  string text = 3;
}

// ModelCallSpeech are the kind="speak" knobs. The TEXT is in `messages`.
message ModelCallSpeech {
  string voice = 1;
  // format is the requested container -- "wav", "mp3", "opus". A worker whose
  // runtime cannot produce it answers in what it can and says so on the result's
  // media_type rather than failing: the caller wanted speech, and speech in a
  // container they did not ask for is still speech.
  string format = 2;
  double speed = 3;
  // speed_set distinguishes "no preference" from a deliberate value, the same
  // way ModelCallParams.temperature_set does.
  bool speed_set = 4;
}

// ModelCallImageRequest are the kind="image" knobs. The PROMPT is in
// `messages`; the generation seed is ModelCallParams.seed, reused rather than
// duplicated here.
message ModelCallImageRequest {
  int32 width = 1;
  int32 height = 2;
  int32 count = 3;
  // format is the requested encoding -- "png", "jpeg", "webp".
  string format = 4;
}

// ModelCallUsage is what the RUNTIME REPORTED about the call.
//
// Never inferred. A runtime that reports nothing sets known=false and
// leaves the counts at zero, and the ledger records billing "unknown"
// rather than a confident zero (memql#4681). The distinction is
// load-bearing in exactly one direction: a local call costs no dollars
// either way, so the only thing an invented count could corrupt is the
// loop-cap arithmetic that is supposed to notice a runaway.
message ModelCallUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  bool known = 3;
  // model is what the runtime ACTUALLY ran, which is not always what
  // was asked for (a quantisation alias, a tag resolving to a digest).
  // A token count without the model it was spent on cannot be read.
  string model = 4;
}

// ModelCallCancel stops a running call. Server -> worker.
message ModelCallCancel {
  string request_id = 1;
  string reason = 2;
}

// -----------------------------------------------------------------------------
// Model pull (epic memql#5103, design D3)
// -----------------------------------------------------------------------------
//
// The engine asks a machine to fetch a model it does not have yet, and
// watches it happen. It is the ModelCall shape rather than a reuse of it,
// because what crosses is different in kind: a call carries the acting user's
// PROMPTS and returns generated text, while a pull carries a model id and
// returns bytes-on-disk progress. Sharing ModelCallStart would have meant a
// message whose every field is empty for one of its two uses.
//
// IT IS NOT A ToolDispatch, and that is the operative constraint rather than
// a preference. The engine-driven `workerHost.exec` path is capped at 600s
// with buffered output, and `ollama pull` on a 40GB model exceeds both the
// cap and the buffer -- it prints a newline-less progress bar for as long as
// the download takes. So the pull needs a start, a progress stream and an
// end, correlated by request id, with no ceiling but the caller's.

// ModelPullStart asks the machine to pull one model.
//
// The MACHINE decides how -- Ollama's own pull, an OpenAI-compatible
// endpoint's equivalent, or a refusal. The engine names the model and nothing
// else, because a runtime flag chosen here would be this cluster's guess
// about software it cannot see (design D2 keeps runtime INSTALL local).
message ModelPullStart {
  // Correlates the progress and the end back to this request. Generated by
  // the engine.
  string request_id = 1;
  // The registration the pull is for. Carried even though the stream already
  // identifies the machine, so a cockpit logging the envelope logs which of
  // its registrations it was: the same machine may hold more than one over
  // its life.
  string registration_id = 2;
  // The model id in the runtime's own vocabulary -- `llama3.1:8b`,
  // `hf.co/owner/repo:Q4_K_M`. Passed through verbatim: the router selects on
  // this exact string, so a translation anywhere between the OS and the
  // runtime would make a pulled model unreachable by the name it was pulled
  // under.
  string model = 3;
}

// ModelPullProgress is one observation of a pull in flight.
//
// ===========================================================================
// THE COUNTERS ARE PER LAYER AND THEY GO BACKWARDS
// ===========================================================================
// Ollama pulls a model as a set of blobs and reports completed/total PER
// BLOB, restarting at zero for each. So `completed_bytes` is NOT monotonic
// across a pull and a client that renders it as one bar will watch the bar
// jump backwards. `status` is the runtime's own line ("pulling
// 8eeb52dfb3bb", "verifying sha256 digest"), which is what actually tells a
// person where they are, and `layer` names the blob the counters belong to so
// a surface can show progress WITHIN the current step without claiming to
// know the whole.
//
// A total the runtime has not stated is 0, never a guess: an invented
// denominator produces a percentage that is wrong in a way nobody can see.
message ModelPullProgress {
  string request_id = 1;
  string model = 2;
  // Bytes fetched for the CURRENT layer. Resets per layer; see above.
  uint64 completed_bytes = 3;
  // Size of the current layer, or 0 when the runtime did not say.
  uint64 total_bytes = 4;
  // The runtime's own status line, verbatim.
  string status = 5;
  // The blob this observation is about, when the runtime names one. Empty
  // during phases that are not a download (verifying, writing the manifest).
  string layer = 6;
}

// ModelPullEnd is the terminal answer for one request_id.
//
// `ok` is the machine's report that the model is now present AND allowed --
// the cockpit writes `models.allow` on success, because a model pulled and
// not allowed is invisible to the fleet and would leave the OS saying a pull
// succeeded while the model never appears.
message ModelPullEnd {
  string request_id = 1;
  string model = 2;
  bool ok = 3;
  // The runtime's own failure text when ok is false. A pull can fail inside
  // an HTTP 200 (Ollama reports errors in the stream body), so a machine that
  // saw one reports it here rather than by dropping the stream.
  string error = 4;
  // Set when the machine re-advertised its label set immediately after the
  // pull rather than waiting for the next fingerprint change (design D3).
  // False means the model is on disk and the cluster will not see it until
  // the machine reconnects, which is a materially different thing to tell
  // the person watching.
  bool readvertised = 5;
}

// ModelPullCancel stops a pull in flight. Best-effort: the runtime may
// already have finished the layer it was on, and a partially fetched blob is
// resumed rather than discarded by the next pull of the same model.
message ModelPullCancel {
  string request_id = 1;
  string reason = 2;
}
