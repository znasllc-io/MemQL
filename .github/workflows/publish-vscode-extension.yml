name: publish-vscode-extension

# THE LAST MILE, which was the missing part (memql#5075).
#
# There was no way to ship the extension to a user. CI already PACKAGED it on
# every relevant PR -- `vscode-extension` runs scripts/vscode/package.sh -- and
# then discarded the artifact. So every fix in it reached the one machine that
# could run `make vscode-install`, and nobody else. Four user-affecting
# extension-side issues were filed in a single day (memql#5056, #5064, #5071,
# #5073) and none of them could reach a user.
#
# It matters more than it would for an ordinary editor extension: for a local
# install the extension IS the product. It carries the install graph, the
# capability scripts (staged into the .vsix) and the whole panel, so "how does a
# user get a fixed extension" is the same question as "how does a user get a
# fixed installer", and the answer was "clone the repo and run a Makefile
# target".
#
# ========================= THREE CHANNELS, EACH GATED =======================
#
# The GitHub Release asset always publishes: it needs no account and no token,
# so the lane is useful the day it lands. The Marketplace and Open VSX steps run
# only when their token exists and SAY SO IN THE SUMMARY when it does not -- a
# silent skip is how "we published" quietly becomes untrue.
#
#   VSCE_PAT  -> VS Code Marketplace (publisher `znasllc`, which package.json
#                already anticipates). This is the channel that makes users
#                get updates automatically, which is what shrinks the version
#                skew in memql#5076 to "between the fix and the update".
#   OVSX_PAT  -> Open VSX, for Cursor and VSCodium. Both are installed on at
#                least one developer machine here, so it is decided now rather
#                than discovered later.
#
# ===================== ONE PACKAGE PER PLATFORM, AND WHY ====================
#
# The extension bundles the offline `memql-lsp` binary, resolved at
# `bin/<node-platform>-<node-arch>/memql-lsp`, so a .vsix runs on exactly one
# platform. `scripts/vscode/package.sh` deliberately `rm -rf`s `bin/` on every
# run for that reason, and its comment asks that a multi-platform flow be an
# explicit opt-in rather than a directory nobody cleaned. The matrix below is
# that opt-in and it keeps the invariant: each leg is its own runner with its
# own checkout, so each still produces exactly ONE platform directory.
#
# WINDOWS IS DELIBERATELY ABSENT. package.sh can build it (`memql-lsp.exe`) and
# the language half would work -- but the install half cannot: the installers
# are `scripts/install/install-{mac,linux}.sh`, and every capability script is
# bash. Shipping it would put an install button in front of users it can only
# refuse, which is the rule this extension states about itself in
# `deploy/instanceActions.ts`. It is one matrix line the day that changes.

on:
  # A published release ships the extension for that release, with no operator
  # step -- which is the whole point: an extension nobody can receive is the
  # defect. Unlike build-engine-images this can run on the tag ref, because it
  # authenticates with repository secrets rather than Azure OIDC.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must equal editors/vscode/package.json's `version`."
        required: true
        type: string
      dry_run:
        description: "Build and verify every package, publish nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ==========================================================================
  # THE VERSION, RESOLVED AND CHECKED BEFORE ANYTHING IS BUILT
  # ==========================================================================
  #
  # memql#5075's other half: "the release needs a VERSION decision too. `0.3.1`
  # has not moved while the staged scripts inside it have, so the version string
  # currently says nothing about what is in the archive."
  #
  # Two things answer that, and they are different answers to different halves.
  # The COMMIT STAMP (memql#5076) makes the archive self-describing whatever the
  # semver says -- that is the honest fix for "which build is this". This job is
  # the other half: a publish REFUSES unless the manifest already carries the
  # version being published, so shipping cannot happen without the version
  # having been moved deliberately. Deriving it from the tag instead would let a
  # release publish a manifest that still says 0.3.1.
  version:
    name: resolve the extension version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          # Through `env:`, never interpolated into the script body -- a
          # dispatch input is a value somebody types, and `${{ }}` substitution
          # happens before the shell sees the line.
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            # TWO CONVENTIONS, ONE RELEASE (memql#4061). Git tags carry the `v`
            # and package versions do not; dispatch-engine-images-on-release.yml
            # strips it for the same reason and records why at length.
            version="${TAG#v}"
          fi
          if [ -z "$version" ]; then
            echo "ERROR: no version to publish -- neither an input nor a release tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "ERROR: asked to publish ${version}, but editors/vscode/package.json says ${manifest}." >&2
            echo "       The manifest is what a user's editor compares against, so publishing a" >&2
            echo "       version it does not carry would ship an archive that names the wrong one." >&2
            echo "       Bump editors/vscode/package.json first (memql#5075)." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "INFO: publishing ${version}"

  # ==========================================================================
  # ONE PACKAGE PER PLATFORM
  # ==========================================================================
  package:
    name: package ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    # The Go build is cross-compiled (CGO_ENABLED=0 in package.sh), so every
    # target builds on the same linux runner. npm install dominates the time.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-x64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it. The
      # same step the vscode-extension lane runs, for the same reason: without
      # it the LSP binary's own build fails on a missing embed.
      - uses: ./.github/actions/identity-css
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # --target is what makes these four DIFFERENT packages rather than
          # one version published four times; see package_vsix in that script.
          bash scripts/vscode/package.sh \
            --goos="${{ matrix.goos }}" \
            --goarch="${{ matrix.goarch }}" \
            --target="$TARGET" \
            --out="$RUNNER_TEMP/memql-${VERSION}-${TARGET}.vsix"

      # THE ARCHIVE HAS TO CARRY WHAT IT CLAIMS TO. Both of these are silent
      # failures otherwise: an unstamped package cannot tell an operator what it
      # was built from (memql#5076), and a package missing the staged tree
      # installs fine and then cannot begin an install (memql#3487).
      - name: The package carries its build stamp and its staged scripts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          vsix="$RUNNER_TEMP/memql-${VERSION}-${TARGET}.vsix"
          unzip -l "$vsix" > "$RUNNER_TEMP/listing.txt"
          for required in \
            "extension/staged/buildinfo.json" \
            "extension/staged/scripts/install/graph/install.json" \
            "extension/staged/scripts/install/graph/install-main.json"
          do
            grep -qF "$required" "$RUNNER_TEMP/listing.txt" || {
              echo "ERROR: ${vsix} does not contain ${required}" >&2
              exit 1
            }
          done
          # And the stamp must name a real commit, not the empty string a
          # checkout with no git would write.
          unzip -p "$vsix" extension/staged/buildinfo.json > "$RUNNER_TEMP/buildinfo.json"
          cat "$RUNNER_TEMP/buildinfo.json"
          commit="$(jq -r '.commit' "$RUNNER_TEMP/buildinfo.json")"
          if [ -z "$commit" ] || [ "$commit" = "null" ]; then
            echo "ERROR: the package records no build commit, so it cannot report skew" >&2
            exit 1
          fi
          echo "[x] ${TARGET} carries buildinfo (${commit}) and the staged install graph"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-${{ matrix.target }}
          path: ${{ runner.temp }}/memql-*.vsix
          if-no-files-found: error

  # ==========================================================================
  # THE LAST MILE
  # ==========================================================================
  publish:
    name: publish the extension
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The GitHub Release asset. Nothing else here writes.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/vsix
          merge-multiple: true

      - name: What was built
        run: ls -la "$RUNNER_TEMP/vsix"

      # ---------------------------------------------------------------------
      # 1. The GitHub Release asset -- always, no account, no token.
      # ---------------------------------------------------------------------
      #
      # Cheapest and the only channel that works on the day this lands. It does
      # NOT solve the update problem -- a user installing by hand is never told
      # a newer one exists -- which is exactly why the two below are wired
      # alongside it rather than instead of it.
      - name: Attach every package to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "NOTE: no release ${tag} exists, so there is nothing to attach the packages to." >&2
            echo "      The Marketplace and Open VSX steps below are unaffected." >&2
            echo "release_asset=skipped (no ${tag} release)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --clobber so a re-publish of the same version replaces the asset
          # rather than failing half way through the set.
          gh release upload "$tag" "$RUNNER_TEMP"/vsix/*.vsix \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "release_asset=published to ${tag}" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 2. VS Code Marketplace -- gated on VSCE_PAT.
      # ---------------------------------------------------------------------
      - name: VS Code Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            # LOUD, NOT SILENT. A skipped channel that says nothing is how a
            # green run comes to mean "shipped" when it did not.
            echo "::warning::VSCE_PAT is not set, so nothing was published to the VS Code Marketplace. Users will not receive this automatically."
            echo "marketplace=SKIPPED (no VSCE_PAT secret)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One call per platform package. Each archive already declares its own
          # target (package.sh --target), so vsce needs no second flag here and
          # cannot be handed one that disagrees with the file.
          npx --yes @vscode/vsce publish --packagePath "$RUNNER_TEMP"/vsix/*.vsix
          echo "marketplace=published" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 3. Open VSX -- gated on OVSX_PAT. Cursor and VSCodium read this one.
      # ---------------------------------------------------------------------
      - name: Open VSX
        if: ${{ !inputs.dry_run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT is not set, so nothing was published to Open VSX. Cursor and VSCodium users will not receive this automatically."
            echo "open_vsx=SKIPPED (no OVSX_PAT secret)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for vsix in "$RUNNER_TEMP"/vsix/*.vsix; do
            echo "publishing $(basename "$vsix")"
            npx --yes ovsx publish "$vsix" --pat "$OVSX_PAT"
          done
          echo "open_vsx=published" >> "$GITHUB_STEP_SUMMARY"

      - name: A dry run publishes nothing, and says so
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true -- every package was built and verified; nothing was published." >> "$GITHUB_STEP_SUMMARY"
